name = "zro-day-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
JWT_SECRET = "your-secret-key-here"

[[durable_objects.bindings]]
name = "TASK_QUEUE"
class_name = "DistributedTaskQueue"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

# Results cache will be added later after proper KV namespace creation

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DistributedTaskQueue", "NodeRegistry"]

# Development environment
[env.dev]
vars = { DEBUG = "true" }
