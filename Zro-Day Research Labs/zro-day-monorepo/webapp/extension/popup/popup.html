<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRO-DAY Security</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 500px;
            background: #000;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            overflow: hidden;
        }

        .radar-container {
            position: relative;
            background: radial-gradient(circle, #001100 0%, #000000 70%);
            border: 2px solid #00ff41;
            height: 100vh;
        }

        .header {
            background: #001a00;
            border-bottom: 1px solid #00ff41;
            padding: 10px;
            text-align: center;
            position: relative;
        }

        .logo {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .logo .zro { color: #00ff41; }
        .logo .day { color: #ffb000; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            font-size: 10px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        .status-active { background: #00ff41; }
        .status-warning { background: #ffb000; }
        .status-danger { background: #ff0000; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .radar-display {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            border: 2px solid #00ff41;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,255,65,0.1) 0%, rgba(0,0,0,0.9) 70%);
        }

        .radar-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border: 1px solid rgba(0,255,65,0.3);
            border-radius: 50%;
        }

        .radar-grid::before,
        .radar-grid::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0,255,65,0.2);
            border-radius: 50%;
        }

        .radar-grid::before {
            width: 120px;
            height: 120px;
        }

        .radar-grid::after {
            width: 60px;
            height: 60px;
        }

        .radar-crosshairs {
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: rgba(0,255,65,0.3);
            transform: translateX(-50%);
        }

        .radar-crosshairs::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 1px;
            background: rgba(0,255,65,0.3);
            transform: translate(-50%, -50%) rotate(90deg);
        }

        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90px;
            height: 2px;
            background: linear-gradient(to right, #00ff41, transparent);
            transform-origin: left center;
            animation: radar-sweep 4s linear infinite;
        }

        @keyframes radar-sweep {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .threat-blip {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite alternate;
        }

        .threat-low { background: #00ff41; }
        .threat-medium { background: #ffb000; }
        .threat-high { background: #ff6600; }
        .threat-critical { background: #ff0000; }

        @keyframes blink {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #00ff41;
        }

        .stat-box {
            background: rgba(0,255,65,0.1);
            border: 1px solid rgba(0,255,65,0.3);
            padding: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #00ff41;
        }

        .stat-label {
            font-size: 9px;
            color: rgba(0,255,65,0.7);
            margin-top: 2px;
        }

        .controls {
            padding: 15px;
            border-top: 1px solid #00ff41;
        }

        .button {
            background: transparent;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 8px 16px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 8px;
        }

        .button:hover {
            background: #00ff41;
            color: #000;
        }

        .button.premium {
            border-color: #ffb000;
            color: #ffb000;
        }

        .button.premium:hover {
            background: #ffb000;
            color: #000;
        }

        .button.danger {
            border-color: #ff0000;
            color: #ff0000;
        }

        .button.danger:hover {
            background: #ff0000;
            color: #000;
        }

        .threat-log {
            max-height: 100px;
            overflow-y: auto;
            font-size: 10px;
            padding: 10px;
            border-top: 1px solid #00ff41;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid rgba(0,255,65,0.2);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: rgba(0,255,65,0.6);
        }

        .log-threat {
            color: #ff6600;
            font-weight: bold;
        }

        .log-blocked {
            color: #00ff41;
        }

        .subscription-banner {
            background: rgba(255,176,0,0.1);
            border: 1px solid #ffb000;
            padding: 8px;
            margin: 10px;
            text-align: center;
            font-size: 10px;
        }

        .subscription-banner.premium {
            background: rgba(0,255,65,0.1);
            border-color: #00ff41;
            color: #00ff41;
        }

        .hidden {
            display: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00cc33;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: rgba(0,255,65,0.6);
        }

        .loading::after {
            content: '';
            animation: loading-dots 1.5s infinite;
        }

        @keyframes loading-dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="radar-container">
        <!-- Header Section -->
        <div class="header">
            <div class="logo">
                <span class="zro">ZRO</span>-<span class="day">DAY</span>
            </div>
            <div class="status-bar">
                <div>
                    <span class="status-indicator status-active" id="protectionStatus"></span>
                    <span id="protectionText">PROTECTION ACTIVE</span>
                </div>
                <div id="subscriptionType">FREE</div>
            </div>
        </div>

        <!-- Radar Display -->
        <div class="radar-display">
            <div class="radar-grid">
                <div class="radar-crosshairs"></div>
            </div>
            <div class="radar-sweep"></div>
            
            <!-- Threat blips will be added dynamically -->
            <div id="threatBlips"></div>
        </div>

        <!-- Statistics Grid -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value" id="threatsBlocked">0</div>
                <div class="stat-label">THREATS BLOCKED</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="lastScan">NEVER</div>
                <div class="stat-label">LAST SCAN</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="realTimeStatus">ON</div>
                <div class="stat-label">REAL-TIME SHIELD</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="apiCalls">0</div>
                <div class="stat-label">API CALLS TODAY</div>
            </div>
        </div>

        <!-- Subscription Banner -->
        <div id="subscriptionBanner" class="subscription-banner">
            <div>FREE TIER - LIMITED PROTECTION</div>
            <div style="margin-top: 4px; font-size: 9px;">Upgrade to TACTICAL for full features</div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="button" id="scanNow">🔍 INITIATE SCAN</button>
            <button class="button" id="openDashboard">📊 COMMAND CENTER</button>
            <button class="button premium" id="upgradeBtn">⚡ UPGRADE TO TACTICAL</button>
        </div>

        <!-- Recent Threat Log -->
        <div class="threat-log" id="threatLog">
            <div class="loading" id="loadingLogs">LOADING THREAT DATA</div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
